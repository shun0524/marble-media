<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok 認証コード</title>
<style>body{font-family:sans-serif;max-width:720px;margin:2em auto;padding:0 16px;line-height:1.7;color:#17252e;background:#fff}code{display:block;word-break:break-all;background:#f3f5f6;padding:12px;border-radius:8px}</style></head><body>
<h1>TikTok の認証コード</h1>
<p>下のコードをコピーして、PC のターミナル（tiktok_token.py setup）に貼り付けてください。チャットには貼らないでください。</p>
<code id="code">（コードがありません）</code>
<p>state（確認用）：</p>
<code id="state">-</code>
<script>
var p = new URLSearchParams(location.search);
if (p.get("code")) document.getElementById("code").textContent = p.get("code");
if (p.get("state")) document.getElementById("state").textContent = p.get("state");
if (p.get("error")) document.getElementById("code").textContent = "エラー：" + p.get("error") + " " + (p.get("error_description") || "");
</script>
</body></html>
